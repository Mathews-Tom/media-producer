spec_version: "0.1.0"
name: media-producer
version: "1.0.0"
description: >
  Visual and video asset creation with intelligent format routing — analyzes
  concepts and selects optimal format from static images, diagrams, animated
  explainers, or presentations.
license: MIT

model:
  preferred: claude-sonnet-4-5-20250929
  fallback:
    - claude-sonnet-4-20250514
    - claude-haiku-4-20250414
  constraints:
    temperature: 0.4
    max_tokens: 16384

skills:
  - concept-to-image
  - concept-to-video
  - remotion-video
  - architecture-diagram
  - html-presentation
  - static-web-artifacts-builder

runtime:
  max_turns: 50
  timeout: 600

tags:
  - visual
  - video
  - diagram
  - infographic
  - presentation
  - animation
  - media
